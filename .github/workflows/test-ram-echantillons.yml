name: Test RAM sur echantillons publics

# Copies de RAM infectees et documentees (Cridex, Zeus, Stuxnet) lues par moteur\Lire-Ram.ps1 :
# les processus signales par DigSpill sont compares aux reponses publiees (.github/tests/ram-attendus.json).
on:
  workflow_dispatch:
  push:
    branches: [ram-echantillons]
    paths: ['moteur/Lire-Ram.ps1', '.github/tests/ram-*', '.github/workflows/test-ram-echantillons.yml', 'app/construire-kit.ps1']

permissions:
  contents: read

jobs:
  echantillons:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Syntaxe PowerShell 5.1
        shell: powershell
        run: |
          $n = 0
          foreach ($f in Get-ChildItem -Recurse -File -Include *.ps1 -Path moteur, app, .github) {
            $t = $null; $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$t, [ref]$e)
            foreach ($x in $e) { Write-Host "::error file=$($f.FullName),line=$($x.Extent.StartLineNumber)::$($x.Message)"; $n++ }
          }
          if ($n) { exit 1 }
      - name: Lecture des echantillons
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\.github\tests\ram-echantillons.ps1
