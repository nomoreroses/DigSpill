name: Kit DigSpill

# Fabrique la cle OUTILS prete a l'emploi : DigSpill.exe + moteur\ (scripts, interface, outils tiers).
# Artefact "DigSpill-cle" a chaque passage ; sur un tag v* (ex. v2.9) ou une release publiee depuis GitHub
# (onglet Releases > Draft a new release), DigSpill.zip est joint a la release.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '**.md']
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# une release creee sur le site lance deux fabrications (tag pousse + release publiee) : l'une apres l'autre,
# sinon elles joignent DigSpill.zip en meme temps et la seconde echoue
concurrency:
  group: kit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire le kit (compilation, outils tiers officiels, collecteur Velociraptor)
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\app\construire-kit.ps1
      - name: Demarrage depuis le kit (mode demonstration, capture de l'accueil)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath kit\DigSpill\DigSpill.exe -ArgumentList '--demo','--capture=accueil.png' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'DigSpill.exe ne repond pas' }
          if (-not (Test-Path accueil.png)) { throw 'capture absente' }
          # page du choix du support PREUVES (demonstration : cle, cle OUTILS et disque du poste)
          $p = Start-Process -FilePath kit\DigSpill\DigSpill.exe -ArgumentList '--demo','--page=support','--capture=support.png' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'DigSpill.exe ne repond pas (page support)' }
          # page des mises a jour (demonstration : rien n'est telecharge)
          $p = Start-Process -FilePath kit\DigSpill\DigSpill.exe -ArgumentList '--demo','--page=maj','--capture=maj.png' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'DigSpill.exe ne repond pas (page mises a jour)' }
          if (Test-Path maj.png) { Write-Host '@@PNG maj.png'; [Convert]::ToBase64String([IO.File]::ReadAllBytes((Resolve-Path maj.png).Path)) -split '(.{1,4000})' | Where-Object { $_ } | ForEach-Object { Write-Host $_ }; Write-Host '@@FINPNG' }
          if (Test-Path support.png) { Write-Host '@@PNG support.png'; [Convert]::ToBase64String([IO.File]::ReadAllBytes((Resolve-Path support.png).Path)) -split '(.{1,4000})' | Where-Object { $_ } | ForEach-Object { Write-Host $_ }; Write-Host '@@FINPNG' }
          foreach ($f in 'moteur\Collecte-Exfil.ps1', 'moteur\Remplacer-Kit.ps1', 'moteur\VERSION.txt', 'moteur\interface\modele.html', 'moteur\outils\Collecteur-Velociraptor.exe', 'moteur\outils\7zr.exe', 'moteur\outils\LICENCE-WinPmem.txt', 'moteur\outils\python\python.exe', 'moteur\outils\python\vol.py', 'moteur\secours\LANCER_COLLECTE.bat') {
            if (-not (Test-Path (Join-Path 'kit\DigSpill' $f))) { throw "absent du kit : $f" }
          }
      - name: Mise a jour du kit (Remplacer-Kit.ps1) sur une copie
        shell: powershell
        run: |
          # ancien kit avec des fichiers propres a ce poste, nouvelle version reconnaissable, faux DigSpill qui se ferme
          $tmp = Join-Path $env:RUNNER_TEMP 'DigSpill-maj'; $ancien = Join-Path $env:RUNNER_TEMP 'kit-ancien'; $nouveau = Join-Path $tmp 'nouveau'
          Remove-Item -LiteralPath $ancien, $tmp -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Copy-Item -LiteralPath kit\DigSpill -Destination $ancien -Recurse
          Set-Content -LiteralPath (Join-Path $ancien 'moteur\digspill.ini') -Value 'technicien.prenom=Essai'
          New-Item -ItemType Directory -Force -Path (Join-Path $ancien 'moteur\outils\bases') | Out-Null
          Set-Content -LiteralPath (Join-Path $ancien 'moteur\outils\bases\liste.txt') -Value 'base'
          Set-Content -LiteralPath (Join-Path $ancien 'moteur\obsolete.txt') -Value 'ancien'
          Expand-Archive -LiteralPath kit\DigSpill.zip -DestinationPath $nouveau
          Set-Content -LiteralPath (Join-Path $nouveau 'moteur\marque.txt') -Value 'nouveau'
          $script = Join-Path $tmp 'Remplacer-Kit.ps1'
          Copy-Item -LiteralPath (Join-Path $nouveau 'moteur\Remplacer-Kit.ps1') -Destination $script
          $faux = Start-Process powershell.exe -ArgumentList '-NoProfile', '-Command', 'Start-Sleep -Seconds 3' -PassThru
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Attendre $faux.Id -Nouveau $nouveau -Kit $ancien
          Start-Sleep -Seconds 5
          Get-Content -LiteralPath (Join-Path $tmp 'journal.txt')
          Get-Process DigSpill -ErrorAction SilentlyContinue | Stop-Process -Force
          $m = Join-Path $ancien 'moteur'
          if (-not (Test-Path -LiteralPath (Join-Path $m 'marque.txt'))) { throw 'nouvelle version absente' }
          if ((Get-Content -LiteralPath (Join-Path $m 'digspill.ini')) -notmatch 'Essai') { throw 'reglages perdus' }
          if (-not (Test-Path -LiteralPath (Join-Path $m 'outils\bases\liste.txt'))) { throw 'bases telechargees perdues' }
          if (Test-Path -LiteralPath (Join-Path $m 'obsolete.txt')) { throw "fichier de l'ancienne version revenu" }
          foreach ($x in 'moteur.ancien', 'moteur.nouveau', 'DigSpill.exe.ancien', 'DigSpill.exe.nouveau') { if (Test-Path -LiteralPath (Join-Path $ancien $x)) { throw "$x reste sur le kit" } }
          if (-not (Test-Path -LiteralPath (Join-Path $ancien 'DigSpill.exe'))) { throw 'DigSpill.exe absent' }
          Write-Host 'Mise a jour : nouvelle version en place, reglages et bases gardes, ancienne version supprimee'
      - name: Icone de DigSpill.exe telle que l'explorateur l'affiche (48 et 256 px)
        shell: powershell
        run: |
          Add-Type -ReferencedAssemblies System.Drawing -TypeDefinition @'
          using System; using System.Drawing; using System.Runtime.InteropServices;
          [ComImport, Guid("bcc18b79-ba16-442f-80c4-8a59c30c463b"), InterfaceType(ComInterfaceType.InterfaceIsIUnknown)]
          interface IShellItemImageFactory { [PreserveSig] int GetImage(Taille t, int options, out IntPtr hbm); }
          [StructLayout(LayoutKind.Sequential)] public struct Taille { public int cx, cy; }
          public static class IconeExplorateur {
              [DllImport("shell32.dll", CharSet = CharSet.Unicode, PreserveSig = false)]
              static extern void SHCreateItemFromParsingName(string chemin, IntPtr bc, [MarshalAs(UnmanagedType.LPStruct)] Guid iid, [MarshalAs(UnmanagedType.Interface)] out object item);
              [DllImport("gdi32.dll")] static extern bool DeleteObject(IntPtr h);
              [DllImport("shell32.dll", CharSet = CharSet.Unicode)] static extern uint ExtractIconEx(string f, int i, IntPtr[] grandes, IntPtr[] petites, uint n);
              public static uint Nombre(string f) { return ExtractIconEx(f, -1, null, null, 0); }
              public static void Rendre(string chemin, int px, string png) {
                  object o; SHCreateItemFromParsingName(chemin, IntPtr.Zero, new Guid("bcc18b79-ba16-442f-80c4-8a59c30c463b"), out o);
                  IntPtr h; int r = ((IShellItemImageFactory)o).GetImage(new Taille { cx = px, cy = px }, 0x4, out h);   // SIIGBF_ICONONLY
                  if (r != 0) throw new Exception("GetImage 0x" + r.ToString("X8"));
                  using (var b = Image.FromHbitmap(h)) b.Save(png); DeleteObject(h);
              }
          }
          '@
          $exe = (Resolve-Path 'kit\DigSpill\DigSpill.exe').Path
          $n = [IconeExplorateur]::Nombre($exe)
          Write-Host "icones dans DigSpill.exe : $n"
          if ($n -lt 1) { throw "DigSpill.exe sans icone" }
          foreach ($px in 48, 256) {
            $png = "icone_$px.png"; [IconeExplorateur]::Rendre($exe, $px, (Join-Path $PWD $png))
            Write-Host "@@PNG $png"; [Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path $PWD $png))) -split '(.{1,4000})' | Where-Object { $_ } | ForEach-Object { Write-Host $_ }; Write-Host '@@FINPNG'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: DigSpill-cle
          path: kit/DigSpill/
      - uses: actions/upload-artifact@v4
        with:
          name: accueil
          path: accueil.png
      - name: Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = "Cle OUTILS prete a l'emploi : dezipper DigSpill.zip a la racine de la cle, puis double-clic sur DigSpill.exe.`n`nOutils tiers et licences : moteur\outils\LISEZ-MOI-OUTILS.txt. Journal des versions : CHANGELOG.md."
          # release deja creee a la main dans GitHub (avec son tag) : on y joint le zip ; sinon on la cree
          gh release view $env:GITHUB_REF_NAME 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { gh release upload $env:GITHUB_REF_NAME kit\DigSpill.zip --clobber }
          else { gh release create $env:GITHUB_REF_NAME kit\DigSpill.zip --title "DigSpill $env:GITHUB_REF_NAME" --notes $notes --prerelease }
          if ($LASTEXITCODE -ne 0) { throw "DigSpill.zip non joint a la release (code $LASTEXITCODE)" }
      - name: Release automatique d'une nouvelle version (premier titre de CHANGELOG.md, sur main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # la mise a jour dans DigSpill lit les releases : chaque version fusionnee dans main est publiee une fois
          $v = (Get-Content kit\DigSpill\moteur\VERSION.txt -TotalCount 1).Trim()
          if (-not $v) { throw 'version du kit inconnue' }
          $tag = "v$v"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { Write-Host "$tag deja publiee"; exit 0 }
          $txt = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $m = [regex]::Match($txt, "(?ms)^## $([regex]::Escape($v))[^\n]*\n(.*?)(?=^## |\z)")
          $notes = $m.Groups[1].Value.Trim() + "`n`n---`nInstallation : dezipper DigSpill.zip a la racine de la cle OUTILS. Deja installe : DigSpill > Mises a jour."
          [IO.File]::WriteAllText("$PWD\notes.md", $notes)
          $opts = @()
          if ($txt -match "(?m)^## $([regex]::Escape($v)) \(b") { $opts += '--prerelease' }
          gh release create $tag kit\DigSpill.zip --target $env:GITHUB_SHA --title "DigSpill $tag" --notes-file notes.md @opts
          if ($LASTEXITCODE -ne 0) { throw "release $tag non creee (code $LASTEXITCODE)" }
