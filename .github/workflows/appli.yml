name: Appli DigSpill.exe

on:
  push:
    paths: ['app/**', '.github/workflows/appli.yml']
  pull_request:
    paths: ['app/**']
  workflow_dispatch:

jobs:
  construire:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler (csc integre a Windows, C# 5)
        shell: cmd
        run: app\CONSTRUIRE.bat
      - name: Demarrage rapide (mode demonstration, capture de l'accueil)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath app\bin\DigSpill.exe -ArgumentList '--demo','--capture=accueil.png' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'DigSpill.exe ne repond pas' }
          if (-not (Test-Path accueil.png)) { throw 'capture absente' }
      - uses: actions/upload-artifact@v4
        with:
          name: DigSpill-non-signe
          path: |
            app/bin/DigSpill.exe
            accueil.png
